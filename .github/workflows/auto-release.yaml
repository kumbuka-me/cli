---
name: Autorelease
on:
  # This job only reads PR metadata, writes tags, dispatches Build, and posts
  # status comments. It must not check out or execute pull-request code.
  pull_request_target:
    types:
      - synchronize
      - labeled
      - unlabeled
      - closed

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create new tag
        uses: projectsyn/pr-label-tag-action@796e1eaeafa4de313848e03bd5341d55a08a596d # v1
        with:
          trigger: |
            Build
